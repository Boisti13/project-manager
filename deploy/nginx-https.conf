# /etc/nginx/sites-available/project-manager (with HTTPS)
# Serves the production React build and proxies the API to Uvicorn over
# HTTPS, with the certificate from scripts/setup-https.sh. Plain HTTP only
# hands out the CA certificate and the health check; everything else is
# redirected. The HTTP-only variant is deploy/nginx.conf.

upstream backend {
    server 127.0.0.1:8000;
}

server {
    listen 80;
    server_name _;

    # Devices fetch this before they trust the certificate.
    location = /ca.crt {
        alias /etc/project-manager/tls/ca.crt;
        default_type application/x-x509-ca-cert;
        add_header Content-Disposition 'attachment; filename="project-manager-ca.crt"';
    }

    # For install.sh / update.sh checks on the machine itself.
    location = /api/health {
        proxy_pass http://backend;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    server_name _;
    client_max_body_size 100M;

    ssl_certificate /etc/project-manager/tls/server.crt;
    ssl_certificate_key /etc/project-manager/tls/server.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:pm_tls:1m;
    ssl_session_timeout 1d;

    root /opt/project-manager/frontend/build;

    location = /ca.crt {
        alias /etc/project-manager/tls/ca.crt;
        default_type application/x-x509-ca-cert;
        add_header Content-Disposition 'attachment; filename="project-manager-ca.crt"';
    }

    location /api/ {
        proxy_pass http://backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Hashed filenames: safe to cache forever.
    location /static/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # index.html must never be cached, or clients keep loading old bundles
    # after an update. Unknown paths fall back to it for client-side routing.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri /index.html;
    }
}
