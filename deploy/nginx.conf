# /etc/nginx/sites-available/project-manager
# Serves the production React build and proxies the API to Uvicorn.

upstream backend {
    server localhost:8000;
}

server {
    listen 80;
    server_name _;
    client_max_body_size 100M;

    root /opt/project-manager/frontend/build;

    location /api/ {
        proxy_pass http://backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Hashed filenames: safe to cache forever.
    location /static/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # index.html must never be cached, or clients keep loading old bundles
    # after an update. Unknown paths fall back to it for client-side routing.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri /index.html;
    }
}
