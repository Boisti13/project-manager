[package]
name = "project-manager-desktop"
version = "0.3.0"
description = "Project Manager for Windows: works offline, syncs with your server"
edition = "2021"
publish = false

[lib]
name = "project_manager_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-updater = "2"
serde_json = "1"  # generate_context! needs it for the plugin config

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
