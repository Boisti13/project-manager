name: Desktop apps

# Builds the Windows and Linux apps (desktop/, Tauri) from the React frontend
# built with REACT_APP_TARGET=desktop: a Windows installer, and for Linux an
# AppImage and a .deb, each for x86_64 and ARM64. Runs when the app or the
# frontend changes; tags desktop-v* also publish everything as one GitHub
# release and point the update feed (latest.json on the release
# "desktop-updates", which installed apps check) at it. Updates are signed
# with the updater key from the secrets TAURI_SIGNING_PRIVATE_KEY(_PASSWORD);
# see desktop/README.md -> Updates.

on:
  push:
    branches: [main, dev, "feature/desktop-*"]
    tags: ["desktop-v*"]
    paths:
      - "frontend/**"
      - "desktop/**"
      - ".github/workflows/desktop.yml"
  pull_request:
    paths:
      - "frontend/**"
      - "desktop/**"
      - ".github/workflows/desktop.yml"
  workflow_dispatch:

permissions:
  contents: write  # for the release on desktop-v* tags

jobs:
  frontend:
    name: Frontend for the apps
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Frontend tests
        working-directory: frontend
        env:
          CI: "true"
        run: |
          npm ci --no-audit --no-fund
          npm test -- --watchAll=false

      - name: Build the frontend for the apps
        working-directory: frontend
        env:
          CI: "true"
          REACT_APP_TARGET: desktop
          GENERATE_SOURCEMAP: "false"
        run: npm run build

      # Also for trying the app's offline logic in a browser.
      - uses: actions/upload-artifact@v7
        with:
          name: desktop-web-build
          path: frontend/build
          retention-days: 14

  windows:
    name: Windows
    needs: frontend
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v7
        with:
          name: desktop-web-build
          path: frontend/build

      - uses: actions/setup-node@v7
        with:
          node-version: 20

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri

      - name: Icons
        working-directory: desktop
        run: npx --yes @tauri-apps/cli@^2 icon ../frontend/public/icon-512.png --output src-tauri/icons

      - name: Build the installer
        working-directory: desktop
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          # With the updater key (not available to pull requests from forks)
          # the build also writes the update signature (*.exe.sig).
          if [ -n "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            npx --yes @tauri-apps/cli@^2 build --ci --bundles nsis --config src-tauri/tauri.updater.conf.json
          else
            echo "::notice::No updater key: building without update signature"
            npx --yes @tauri-apps/cli@^2 build --ci --bundles nsis
          fi

      - uses: actions/upload-artifact@v7
        with:
          name: app-windows-x86_64
          path: |
            desktop/src-tauri/target/release/bundle/nsis/*.exe
            desktop/src-tauri/target/release/bundle/nsis/*.exe.sig
          retention-days: 30

  linux:
    name: Linux ${{ matrix.arch }}
    needs: frontend
    strategy:
      fail-fast: false
      matrix:
        include:
          # 22.04 so the app also runs on older distributions (Debian 12, Mint 21, …)
          - arch: x86_64
            runner: ubuntu-22.04
          - arch: aarch64
            runner: ubuntu-22.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v7
        with:
          name: desktop-web-build
          path: frontend/build

      - uses: actions/setup-node@v7
        with:
          node-version: 20

      - name: Build dependencies (WebKitGTK etc.)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf \
            libssl-dev file xvfb >/dev/null

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri
          key: ${{ matrix.arch }}

      - name: Icons
        working-directory: desktop
        run: npx --yes @tauri-apps/cli@^2 icon ../frontend/public/icon-512.png --output src-tauri/icons

      - name: Build the AppImage and the .deb
        working-directory: desktop
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          APPIMAGE_EXTRACT_AND_RUN: "1"  # the AppImage tools run without FUSE
        run: |
          # With the updater key the AppImage also gets its update signature (*.AppImage.sig).
          if [ -n "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            npx --yes @tauri-apps/cli@^2 build --ci --bundles appimage,deb --config src-tauri/tauri.updater.conf.json
          else
            echo "::notice::No updater key: building without update signature"
            npx --yes @tauri-apps/cli@^2 build --ci --bundles appimage,deb
          fi

      # Does it start? Run the AppImage on a virtual display for 20 seconds:
      # still running at the end (exit 124 from timeout) = it started.
      - name: Start check
        run: |
          app=$(ls desktop/src-tauri/target/release/bundle/appimage/*.AppImage)
          chmod +x "$app"
          set +e
          APPIMAGE_EXTRACT_AND_RUN=1 xvfb-run -a timeout 20 "$app" > start.log 2>&1
          code=$?
          set -e
          cat start.log | tail -20
          if [ "$code" != "124" ]; then echo "::error::The app exited early (code $code)"; exit 1; fi

      - uses: actions/upload-artifact@v7
        with:
          name: app-linux-${{ matrix.arch }}
          path: |
            desktop/src-tauri/target/release/bundle/appimage/*.AppImage
            desktop/src-tauri/target/release/bundle/appimage/*.AppImage.sig
            desktop/src-tauri/target/release/bundle/deb/*.deb
          retention-days: 30

  release:
    name: Release (desktop-v* tags)
    if: startsWith(github.ref, 'refs/tags/desktop-v')
    needs: [windows, linux]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v7
        with:
          pattern: app-*
          path: apps

      - name: Publish the release and the update feed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          ls -R apps
          exe=$(ls apps/app-windows-x86_64/*-setup.exe)
          appimage_x86=$(ls apps/app-linux-x86_64/appimage/*.AppImage)
          appimage_arm=$(ls apps/app-linux-aarch64/appimage/*.AppImage)
          debs=(apps/app-linux-*/deb/*.deb)  # file names contain spaces
          for f in "$exe" "$appimage_x86" "$appimage_arm"; do
            if [ ! -f "$f.sig" ]; then echo "::error::No update signature for $f - is TAURI_SIGNING_PRIVATE_KEY set?"; exit 1; fi
          done
          version="${GITHUB_REF_NAME#desktop-v}"
          notes="$(awk -v h="## v$version" 'index($0,h)==1{f=1;next} f&&/^## /{exit} f' desktop/CHANGELOG.md)"
          gh release create "$GITHUB_REF_NAME" "$exe" "$appimage_x86" "$appimage_arm" "${debs[@]}" \
            --title "Project Manager app v$version (Windows, Linux)" --notes "${notes:-Project Manager app}" --latest=false

          # Update feed. GitHub renames assets (spaces -> dots), so take the real URLs.
          asset() { gh release view "$GITHUB_REF_NAME" --json assets --jq ".assets[] | select(.name | $1) | .url"; }
          url_exe=$(asset 'endswith("-setup.exe")')
          url_x86=$(asset 'endswith(".AppImage") and (contains("amd64") or contains("x86_64"))')
          url_arm=$(asset 'endswith(".AppImage") and (contains("aarch64") or contains("arm64"))')
          jq -n --arg v "$version" --arg notes "$notes" --arg date "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
                --arg sig_exe "$(cat "$exe.sig")" --arg url_exe "$url_exe" \
                --arg sig_x86 "$(cat "$appimage_x86.sig")" --arg url_x86 "$url_x86" \
                --arg sig_arm "$(cat "$appimage_arm.sig")" --arg url_arm "$url_arm" \
            '{version: $v, notes: $notes, pub_date: $date, platforms: {
                "windows-x86_64": {signature: $sig_exe, url: $url_exe},
                "linux-x86_64": {signature: $sig_x86, url: $url_x86},
                "linux-aarch64": {signature: $sig_arm, url: $url_arm}}}' > latest.json
          cat latest.json
          jq -e '.platforms[] | select(.url == "")' latest.json && { echo "::error::A download URL is missing"; exit 1; } || true
          gh release view desktop-updates >/dev/null 2>&1 || gh release create desktop-updates --prerelease --latest=false \
            --target "$GITHUB_SHA" --title "Desktop apps: update feed" \
            --notes "Not a release: latest.json here tells installed apps which version is current. Downloads are on the desktop-v* releases."
          gh release upload desktop-updates latest.json --clobber

          # The latest server release (what GitHub shows as "Latest") carries
          # the apps too, under fixed names: that's where people download them.
          bash scripts/attach-apps.sh "$(gh release view --json tagName --jq .tagName)" "$GITHUB_REF_NAME"
