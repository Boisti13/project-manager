name: Windows app

# Builds the Windows app (desktop/, Tauri) from the React frontend built with
# REACT_APP_TARGET=desktop. Runs when the app or the frontend changes; tags
# desktop-v* also publish the installer as a GitHub release and point the
# update feed (latest.json on the release "desktop-updates", which installed
# apps check) at it. Updates are signed with the updater key from the secrets
# TAURI_SIGNING_PRIVATE_KEY(_PASSWORD); see desktop/README.md -> Updates.

on:
  push:
    branches: [main, dev, "feature/desktop-*"]
    tags: ["desktop-v*"]
    paths:
      - "frontend/**"
      - "desktop/**"
      - ".github/workflows/desktop.yml"
  pull_request:
    paths:
      - "frontend/**"
      - "desktop/**"
      - ".github/workflows/desktop.yml"
  workflow_dispatch:

permissions:
  contents: write  # for the release on desktop-v* tags

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Frontend tests
        working-directory: frontend
        env:
          CI: "true"
        run: |
          npm ci --no-audit --no-fund
          npm test -- --watchAll=false

      - name: Build the frontend for the app
        working-directory: frontend
        env:
          CI: "true"
          REACT_APP_TARGET: desktop
          GENERATE_SOURCEMAP: "false"
        run: npm run build

      # The same build, for trying the app's offline logic in a browser.
      - uses: actions/upload-artifact@v7
        with:
          name: desktop-web-build
          path: frontend/build
          retention-days: 14

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri

      - name: Icons
        working-directory: desktop
        run: npx --yes @tauri-apps/cli@^2 icon ../frontend/public/icon-512.png --output src-tauri/icons

      - name: Build the installer
        working-directory: desktop
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          # With the updater key (not available to pull requests from forks)
          # the build also writes the update signature (*.exe.sig).
          if [ -n "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            npx --yes @tauri-apps/cli@^2 build --ci --config src-tauri/tauri.updater.conf.json
          else
            echo "::notice::No updater key: building without update signature"
            npx --yes @tauri-apps/cli@^2 build --ci
          fi

      - uses: actions/upload-artifact@v7
        with:
          name: project-manager-windows-installer
          path: |
            desktop/src-tauri/target/release/bundle/nsis/*.exe
            desktop/src-tauri/target/release/bundle/nsis/*.exe.sig
          retention-days: 30

      - name: Release (desktop-v* tags)
        if: startsWith(github.ref, 'refs/tags/desktop-v')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          exe=$(ls desktop/src-tauri/target/release/bundle/nsis/*-setup.exe)
          if [ ! -f "$exe.sig" ]; then echo "::error::No update signature - is TAURI_SIGNING_PRIVATE_KEY set?"; exit 1; fi
          version="${GITHUB_REF_NAME#desktop-v}"
          notes="$(awk -v h="## v$version" 'index($0,h)==1{f=1;next} f&&/^## /{exit} f' desktop/CHANGELOG.md)"
          gh release create "$GITHUB_REF_NAME" "$exe" \
            --title "Windows app v$version" --notes "${notes:-Windows app}" --latest=false

          # Update feed. GitHub renames assets (spaces -> dots), so take the real URL.
          url=$(gh release view "$GITHUB_REF_NAME" --json assets --jq '.assets[] | select(.name | endswith("-setup.exe")) | .url')
          jq -n --arg v "$version" --arg notes "$notes" --arg date "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
                --arg sig "$(cat "$exe.sig")" --arg url "$url" \
            '{version: $v, notes: $notes, pub_date: $date, platforms: {"windows-x86_64": {signature: $sig, url: $url}}}' > latest.json
          cat latest.json
          gh release view desktop-updates >/dev/null 2>&1 || gh release create desktop-updates --prerelease --latest=false \
            --target "$GITHUB_SHA" --title "Windows app: update feed" \
            --notes "Not a release: latest.json here tells installed Windows apps which version is current. Downloads are on the desktop-v* releases."
          gh release upload desktop-updates latest.json --clobber
